name: Windows Setup Installer

on:
  push:
    branches: [main, master]
    tags: ["v*-beta*", "v*-rc*"]
  workflow_dispatch:

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # ================================================================
  # Job 0: 生成版本号
  # ================================================================
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      tag_name: ${{ steps.gen.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            DATE=$(date -u +%Y%m%d.%H%M%S)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="v0.0.0-beta.${DATE}+${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

  # ================================================================
  # Job 1: 构建 client-card.exe（CGO_ENABLED=0，ubuntu 即可）
  # ================================================================
  build-client:
    name: Build client (Windows/amd64)
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: clients/go.sum

      - name: Build client-card.exe
        working-directory: clients
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ needs.version.outputs.version }}" \
            -o client-card.exe \
            ./cmd/client-card

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: clients/client-card.exe
          retention-days: 7

  # ================================================================
  # Job 2: 构建 natives-client.exe（CGO_ENABLED=1，需 MinGW）
  # ================================================================
  build-native:
    name: Build natives client (Windows/amd64)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (for CGO / Fyne)
        run: choco install mingw --no-progress -y

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: natives/go.sum

      - name: Build natives-client.exe
        working-directory: natives
        shell: cmd
        run: build-windows.bat "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          path: natives/dist/natives-client.exe
          retention-days: 7

  # ================================================================
  # Job 3: 构建 Electron desktop（unpacked，供 Inno Setup 打包）
  # ================================================================
  build-desktop:
    name: Build desktop (Windows unpacked)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unpacked app
        working-directory: desktop
        run: npx electron-builder --win dir

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/win-unpacked/
          retention-days: 7

  # ================================================================
  # Job 4: Inno Setup 打包 → 生成安装程序
  # ================================================================
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [version, build-client, build-native, build-desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: pkg/

      # 整理成 ISS 期望的目录结构
      - name: Stage packaging directory
        shell: pwsh
        run: |
          # client / native 下载后带子目录，展平到 pkg/client/ 和 pkg/native/
          Move-Item pkg/client-windows/client-card.exe pkg/client/client-card.exe -Force
          Move-Item pkg/native-windows/native-client.exe pkg/native/native-client.exe -Force
          # desktop artifact 已下载到 pkg/desktop-windows/，重命名
          Rename-Item pkg/desktop-windows pkg/desktop
          # 驱动：保留 build/ + setup/ 兄弟结构（installer_all.bat 依赖 %SCRIPT_DIR%..\build）
          New-Item -ItemType Directory -Force -Path pkg/drivers/build | Out-Null
          New-Item -ItemType Directory -Force -Path pkg/drivers/setup | Out-Null
          Copy-Item -Path drivers/build/* -Destination pkg/drivers/build/ -Recurse -Force
          Copy-Item -Path drivers/setup/* -Destination pkg/drivers/setup/ -Recurse -Force
          # 复制 wrapper 脚本（无 pause 的调用入口）
          Copy-Item scripts/setup/install-drivers.bat   pkg/drivers/setup/ -Force
          Copy-Item scripts/setup/uninstall-drivers.bat pkg/drivers/setup/ -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iss  = "$($PWD.Path)\scripts\setup\opencert.iss"
          $ver  = "${{ needs.version.outputs.version }}"
          $pkg  = "$($PWD.Path)\pkg"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DAppVersion=$ver" `
            "/DPkgDir=$pkg" `
            "/O$($PWD.Path)\dist" `
            $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: opencert-setup-windows
          path: dist/opencert-setup-*.exe
          retention-days: 7

  # ================================================================
  # Job 5: 发布到 Beta Release
  # ================================================================
  release:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: [version, build-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: opencert-setup-windows
          path: dist/

      - name: Create git tag (branch push only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.tag_name }}" "${{ github.sha }}"
          git push origin "${{ needs.version.outputs.tag_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: "OpenCert Setup ${{ needs.version.outputs.version }}"
          prerelease: true
          draft: false
          files: dist/opencert-setup-*.exe
          body: |
            ## Windows 安装包 (Beta)

            **版本**: ${{ needs.version.outputs.version }}
            **Commit**: ${{ github.sha }}

            ### 安装说明
            - 以管理员身份运行 `opencert-setup-*.exe`
            - 安装程序将自动安装驱动、注册 KSP/CSP、创建后台服务并添加桌面快捷方式
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
